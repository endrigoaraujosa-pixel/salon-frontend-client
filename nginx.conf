# Use the original request URI: SPA fallback internally rewrites to /index.html.
# Validate both sources before interpolating anything into the HTML.
map $arg_loja $booking_query_tenant {
    default "";
    "~^[a-zA-Z0-9_-]{1,63}$" $arg_loja;
}
map $request_uri $booking_html_tenant {
    default $booking_query_tenant;
    "~^/loja=(?<booking_path_tenant>[a-zA-Z0-9_-]{1,63})(?:/|\?|$)" $booking_path_tenant;
}
map $booking_html_tenant $booking_manifest_href {
    "" "/manifest.json";
    default "/manifest.json?loja=$booking_html_tenant";
}

# Restrict the tenant before interpolating it into JSON.
map $arg_loja $salon_pwa_start {
    default "/";
    "~^[a-zA-Z0-9_-]{1,63}$" "/loja=$arg_loja/";
}
map $arg_loja $salon_pwa_id {
    default "/";
    "~^[a-zA-Z0-9_-]{1,63}$" "/?loja=$arg_loja";
}
server {
    listen       80;
    server_name  localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Safari must discover the tenant manifest in the first HTML response,
    # before JavaScript runs. Do not serve a shared compressed HTML file.
    gzip_static off;
    sub_filter_once on;
    sub_filter 'href="/manifest.json"' 'href="$booking_manifest_href"';

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }
    location = /pwa-health.txt {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /manifest.json {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-store" always;
        return 200 '{"id":"$salon_pwa_id","name":"Agendamento Online","short_name":"Agendamento Online","description":"Requer conexão com a internet.","lang":"pt-BR","start_url":"$salon_pwa_start","scope":"/","display":"standalone","background_color":"#F4F8F6","theme_color":"#84A59D","icons":[{"src":"/pwa-original-192.png","sizes":"192x192","type":"image/png","purpose":"any"},{"src":"/pwa-original-512.png","sizes":"512x512","type":"image/png","purpose":"any"},{"src":"/pwa-original-maskable-512.png","sizes":"512x512","type":"image/png","purpose":"maskable"}]}';
    }

    # HTML — NUNCA cachear (deve sempre buscar a versão mais recente)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri /index.html;
    }

    # Manifest, version.json e Service Worker — revalidar sempre
    location ~* (manifest\.json|version\.json|sw\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Assets versionados com hash (JS, CSS, imagens, fontes)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Favicon e outros assets estáticos na raiz
    location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|eot)$ {
        add_header Cache-Control "public, max-age=604800" always;
    }

    # SPA fallback — todas as rotas retornam index.html (sem cache)
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
